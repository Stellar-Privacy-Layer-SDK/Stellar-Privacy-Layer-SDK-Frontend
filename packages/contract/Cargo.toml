[package]
name = "stellar-privacy-verifier"
version = "1.0.0"
edition = "2021"
description = "Soroban verifier contract for Stellar Privacy Layer — validates Groth16 proofs over BN254 with on-chain pairing checks (Stellar Protocol 25)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "27.0.5"
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
