[package]
name = "stellar-shielded-pool"
version = "2.0.0"
edition = "2021"
description = "Fixed-denomination shielded pool for Soroban with Groth16 withdrawals"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "27.0.5"
soroban-poseidon = "27.0.0"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
