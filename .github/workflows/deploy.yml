name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in `if` conditions, so map the
    # token to a job env var first and check that. The job is skipped (not
    # failed) until VERCEL_TOKEN is configured in the repo secrets.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    if: github.repository_owner == 'Stellar-Privacy-Layer-SDK' && env.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (dApp resolves @stellar-privacy/sdk from dist)
        run: npm run build -w packages/core-sdk

      - name: Deploy to Vercel
        working-directory: packages/dapp
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          # Link the project without interactive prompts (idempotent).
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
